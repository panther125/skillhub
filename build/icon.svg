<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C1D24"/>
      <stop offset="1" stop-color="#0B0C0E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C86E8"/>
      <stop offset="1" stop-color="#5E6AD2"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#5E6AD2"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#2E3040" stroke-width="3"/>

  <!-- 堆叠的「包」：三个错位方块代表多个来源目录 -->
  <g opacity="0.42">
    <rect x="150" y="118" width="212" height="212" rx="40" fill="none" stroke="#5E6AD2" stroke-width="14"/>
  </g>
  <g opacity="0.68">
    <rect x="132" y="142" width="212" height="212" rx="40" fill="none" stroke="#7C86E8" stroke-width="14"/>
  </g>
  <rect x="114" y="166" width="212" height="212" rx="40" fill="url(#accent)" opacity="0.18"/>
  <rect x="114" y="166" width="212" height="212" rx="40" fill="none" stroke="url(#accent)" stroke-width="16"/>

  <!-- 中心对勾：代表「统一管理 / 校验通过」 -->
  <path d="M158 272 L208 322 L292 238" fill="none" stroke="url(#accent2)"
        stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
